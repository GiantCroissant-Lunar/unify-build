name: Validate Examples

on:
  push:
    paths:
      - 'examples/**'
      - 'build/build.config.schema.json'
      - 'dotnet/src/UnifyBuild.Nuke/**'
      - 'dotnet/tests/UnifyBuild.Nuke.Tests/**'
  pull_request:
    paths:
      - 'examples/**'
      - 'build/build.config.schema.json'
      - 'dotnet/src/UnifyBuild.Nuke/**'
      - 'dotnet/tests/UnifyBuild.Nuke.Tests/**'

jobs:
  validate-dotnet-examples:
    name: Validate .NET Examples
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate dotnet-library
        run: dotnet restore
        working-directory: examples/dotnet-library

      - name: Build dotnet-library
        run: dotnet build --no-restore
        working-directory: examples/dotnet-library

      - name: Validate dotnet-application
        run: dotnet restore
        working-directory: examples/dotnet-application

      - name: Build dotnet-application
        run: dotnet build --no-restore
        working-directory: examples/dotnet-application

      - name: Validate monorepo
        run: dotnet restore
        working-directory: examples/monorepo

      - name: Build monorepo
        run: dotnet build --no-restore
        working-directory: examples/monorepo

      - name: Validate multi-target
        run: dotnet restore
        working-directory: examples/multi-target

      - name: Build multi-target
        run: dotnet build --no-restore
        working-directory: examples/multi-target

      - name: Validate unity-project
        run: dotnet restore
        working-directory: examples/unity-project

      - name: Build unity-project
        run: dotnet build --no-restore
        working-directory: examples/unity-project

  validate-config-schemas:
    name: Validate build.config.json files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate all public example configs
        run: >
          dotnet test dotnet/tests/UnifyBuild.Nuke.Tests/UnifyBuild.Nuke.Tests.csproj
          --configuration Release
          --filter FullyQualifiedName~BuildConfigSchemaGeneratorTests
