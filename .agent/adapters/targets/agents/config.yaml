# Cross-CLI deployment target via the open Agent Skills spec.
#
# Populates .agents/skills/ (read by Codex, Copilot, Kimi, OpenCode, and Kilo
# natively, plus Claude Code via the Agent Skills compatibility layer).
# The tracked AGENTS.md at the repository root is the canonical rules file.
# Pi is intentionally not an active adapter.

tool: agents
display_name: Cross-CLI (.agents/ standard)

skills:
  target: .agents/skills
  strategy: symlink
  local:
    - dotnet-build
  workspace:
    - 00-meta/autoloop
    - 00-meta/check-before-claim
    - 00-meta/context-discovery
    - 00-meta/implementation-review
    - 00-meta/rfc-orchestrator
    - 00-meta/rfc-review
    - 00-meta/skill-creator
    - 00-meta/validation-guard
    - 04-tooling/build
    - 04-tooling/commit
    - 04-tooling/external-agent-delegation
    - 04-tooling/mcp-troubleshooter
    - 04-tooling/nuget-restore
    - 04-tooling/repomix
    - 04-tooling/unify-build
    - 04-tooling/vendor-patches
    - 04-tooling/vendor-restore

mcp:
  enabled: false

hooks:
  enabled: false
