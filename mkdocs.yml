site_name: UnifyBuild
site_description: .NET build orchestration system built on NUKE
site_url: https://giantcroissant-lunar.github.io/unify-build/
repo_url: https://github.com/GiantCroissant-Lunar/unify-build
repo_name: GiantCroissant-Lunar/unify-build

docs_dir: docs

# Archive pages are still built and linkable, but are intentionally kept out of
# the sidebar. Without this, MkDocs warns that they are absent from the nav.
not_in_nav: |
  archive/**

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

# Nav is split by audience: "Using" is for consumers of the tool, "Developing" is
# for people changing UnifyBuild itself. docs/archive/ is deliberately excluded --
# it is superseded material kept for maintainers, not published documentation.
nav:
  - Home: index.md
  - Using UnifyBuild:
    - Getting Started: guides/getting-started.md
    - Migration Guide: guides/migration-guide.md
    - Troubleshooting: guides/troubleshooting.md
    - Reference:
      - Configuration: reference/configuration-reference.md
      - Targets: reference/targets.md
      - CLI: reference/cli.md
      - Caching: reference/caching.md
      - Telemetry: reference/telemetry.md
      - Tooling: reference/tooling.md
    - Examples:
      - .NET Library: examples/dotnet-library.md
      - .NET Application: examples/dotnet-application.md
      - Multi-Target Library: examples/multi-target.md
      - Monorepo: examples/monorepo.md
      - Native Build (CMake): examples/native-build.md
      - Unity Build: examples/unity-build.md
  - Developing UnifyBuild:
    - Architecture: architecture/index.md
    - Extending UnifyBuild: guides/extending.md
    - Releasing: guides/releasing.md
    - Agent Rules and Skills: guides/agent-rules.md
    - Contributing: https://github.com/GiantCroissant-Lunar/unify-build/blob/main/CONTRIBUTING.md
    - Decisions:
      - ADR 0001 Build Config Schema Versioning: architecture/adrs/adr-0001-build-config-schema-versioning.md
      - RFC 0001 Generic Build Schema: architecture/rfcs/rfc-0001-generic-build-schema.md
      - RFC 0002 Dotnet Tool Distribution: architecture/rfcs/rfc-0002-dotnet-tool-distribution.md
    - Specifications:
      - Overview: specs/index.md
      - Automated JSON Schema Generation:
        - Requirements: specs/automated-json-schema-generation/requirements.md
        - Design: specs/automated-json-schema-generation/design.md
        - Tasks: specs/automated-json-schema-generation/tasks.md
      - Project Enhancements 2026:
        - Requirements: specs/project-enhancements-2026/requirements.md
        - Design: specs/project-enhancements-2026/design.md
        - Tasks: specs/project-enhancements-2026/tasks.md
